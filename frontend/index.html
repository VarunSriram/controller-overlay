<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper" id="app-wrapper">
        <div class="controller">
            <div id="status">Press any button</div>
            
            <!-- Triggers (LT / RT) -->
            <div id="btn-6" class="shoulder">LT</div>
            <div id="btn-7" class="shoulder">RT</div>

            <!-- Bumpers (LB / RB) -->
            <div id="btn-4" class="shoulder">LB</div>
            <div id="btn-5" class="shoulder">RB</div>

            <!-- Center Buttons -->
            <div id="btn-8" class="button center-btn">SELECT</div>
            <div id="btn-9" class="button center-btn">START</div>

            <!-- D-Pad -->
            <div id="dpad">
                <div id="btn-12" class="dpad-dir">U</div>
                <div id="btn-13" class="dpad-dir">D</div>
                <div id="btn-14" class="dpad-dir">L</div>
                <div id="btn-15" class="dpad-dir">R</div>
            </div>

            <!-- Sticks -->
            <div id="stick-left-area" class="stick-area">
                <div id="stick-left" class="stick"></div>
            </div>
            <div id="stick-right-area" class="stick-area">
                <div id="stick-right" class="stick"></div>
            </div>

            <!-- Face Buttons -->
            <div id="btn-3" class="button">Y</div>
            <div id="btn-2" class="button">X</div>
            <div id="btn-1" class="button">B</div>
            <div id="btn-0" class="button">A</div>
        </div>

        <!-- Scale Controls & Close -->
        <div class="scale-controls">
            <button id="scale-down" class="scale-btn">-</button>
            <span id="scale-text">100%</span>
            <button id="scale-up" class="scale-btn">+</button>
            <div class="divider"></div>
            <button id="close-app" class="scale-btn close-btn">X</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
