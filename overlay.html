<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Controller Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper" id="scale-wrapper">
    <button class="scale-btn close-btn" id="btn-close">X</button>
    <div class="controller">
      <div id="status">Waiting for OS controller data...</div>
      
      <div id="btn-6" class="shoulder">LT</div>
      <div id="btn-7" class="shoulder">RT</div>
      <div id="btn-4" class="shoulder">LB</div>
      <div id="btn-5" class="shoulder">RB</div>

      <!--div id="btn-16" class="button center-btn">X</div-->
      <div id="btn-8" class="button center-btn">SEL</div>
      <div id="btn-9" class="button center-btn">STA</div>

      <div id="stick-left-area" class="stick-area"><div id="stick-left" class="stick"></div></div>
      <div id="stick-right-area" class="stick-area"><div id="stick-right" class="stick"></div></div>

      <div id="dpad">
        <div id="btn-12" class="dpad-dir"></div>
        <div id="btn-13" class="dpad-dir"></div>
        <div id="btn-14" class="dpad-dir"></div>
        <div id="btn-15" class="dpad-dir"></div>
      </div>

      <div id="btn-0" class="button">A</div>
      <div id="btn-1" class="button">B</div>
      <div id="btn-2" class="button">X</div>
      <div id="btn-3" class="button">Y</div>
    </div>

   <div class="scale-controls">
      <button class="scale-btn" id="btn-minus">-</button>
      <span>Size</span>
      <button class="scale-btn" id="btn-plus">+</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
